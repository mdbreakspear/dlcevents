name: HireHop Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

     - name: Run HireHop → Supabase sync
  run: node hirehop_export.js
  env:
    SB_KEY: ${{ secrets.SB_KEY }}
    SB_URL: ${{ secrets.SB_URL }}
    HIREHOP_PASS: ${{ secrets.HIREHOP_PASS }}
    HIREHOP_EMAIL: ${{ secrets.HIREHOP_EMAIL }}
