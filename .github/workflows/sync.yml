name: HireHop Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run HireHop → Supabase sync
        run: node hirehop_export.js
        env:
          HIREHOP_PASS: ${{ secrets.HIREHOP_PASS }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
