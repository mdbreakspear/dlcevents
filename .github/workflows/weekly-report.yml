name: Weekly CRM Report

on:
  # Every Monday at 06:00 UAE time (UTC+4) = 02:00 UTC
  schedule:
    - cron: '0 2 * * 1'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # canvas requires native build tools
      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Weekly Report & Upload to Dropbox
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/generate-report.js weekly

      - name: Report result
        if: always()
        run: |
          echo "Weekly report job finished with status: ${{ job.status }}"
